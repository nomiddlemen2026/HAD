<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password · H.A.D</title>
<link rel="stylesheet" href="/css/app.css">
<script src="/js/core.js" defer></script><script src="/js/auth.js" defer></script>
</head>
<body>
<div class="auth-wrap"><div class="card auth-card">
  <h1 style="font-size:1.5rem">Choose a new password</h1>
  <div id="msg"></div>
  <form id="reset-form" novalidate>
    <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" minlength="10" autocomplete="new-password" required><div class="hint">At least 10 characters. You will be logged out everywhere else.</div></div>
    <button class="btn primary block" type="submit">Save password</button>
  </form>
</div></div>
</body>
</html>
