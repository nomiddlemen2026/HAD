<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · H.A.D</title>
<link rel="stylesheet" href="/css/app.css">
<script src="/js/core.js" defer></script><script src="/js/auth.js" defer></script>
</head>
<body>
<div class="auth-wrap"><div class="card auth-card">
  <h1 style="font-size:1.5rem">Log in</h1>
  <p class="muted">Access your private cases and evidence.</p>
  <div id="msg"></div>
  <form id="login-form" novalidate>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn primary block" type="submit">Log in</button>
  </form>
  <p class="small" style="margin-top:14px"><a href="/forgot.html">Forgot your password?</a> · <a href="/register.html">Create an account</a></p>
</div></div>
</body>
</html>
